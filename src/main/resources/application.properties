spring.application.name=KriptoPortfolyo

# ---- MySQL Veritabani Baglantisi ----
spring.datasource.url=jdbc:mysql://localhost:3306/crypto_portfolio_db?useSSL=false&serverTimezone=Europe/Istanbul&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1725
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Dosya Yukleme (Multipart) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ---- Server ----
server.port=8080
