<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">

<head th:replace="~{fragments/header :: head('Coin Detay Grafiği — KriptoPortföy')}">
</head>

<body>

<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="page-content">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="section-title text-white">
                <i class="bi bi-graph-up text-accent me-2"></i> 
                <span th:text="${symbol} + ' Grafiği'">BTC Grafiği</span>
            </h3>
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Dashboard'a Dön
            </a>
        </div>

        <div class="dashboard-card p-0 overflow-hidden" style="height: 600px;">
            <!-- TradingView Widget Container -->
            <div id="tradingview_chart" style="height: 100%; width: 100%;"></div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>

<!-- TradingView Script'i -->
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        /*<![CDATA[*/
        const symbol = /*[[${symbol}]]*/ 'BTC';
        /*]]>*/
        
        // TradingView formatı genelde "BINANCE:BTCUSDT" şeklindedir.
        const tvSymbol = "BINANCE:" + symbol + "USDT";

        new TradingView.widget({
            "autosize": true,
            "symbol": tvSymbol,
            "interval": "D",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "tr",
            "enable_publishing": false,
            "backgroundColor": "#1a1a2e",
            "gridColor": "rgba(255, 255, 255, 0.06)",
            "hide_top_toolbar": false,
            "hide_legend": false,
            "save_image": false,
            "container_id": "tradingview_chart"
        });
    });
</script>

</body>
</html>
