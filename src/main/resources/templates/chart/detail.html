<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head th:replace="~{fragments/header :: head('Grafik Detayı — KriptoPortföy')}"></head>
<body>

<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="page-content">
    <div class="container-fluid px-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="section-title mb-1">
                    <i class="bi bi-graph-up-arrow me-2" style="color: #00d2ff;"></i>
                    <span th:text="${symbol}">BTC</span>/USDT Grafiği
                </h3>
                <p class="section-subtitle mb-0">Seçilen varlığın detaylı teknik analizi.</p>
            </div>
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Dashboard'a Dön
            </a>
        </div>

        <div class="dashboard-card p-0 overflow-hidden" style="height: 75vh; min-height: 500px;">
            <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
                <div id="tradingview_detail" style="height: 100%; width: 100%;"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                <script type="text/javascript" th:inline="javascript">
                    /*<![CDATA[*/
                    var symbol = /*[[${symbol}]]*/ 'BTC';
                    new TradingView.widget(
                        {
                            "autosize": true,
                            "symbol": "BINANCE:" + symbol + "USDT",
                            "interval": "D",
                            "timezone": "Etc/UTC",
                            "theme": "dark",
                            "style": "1",
                            "locale": "tr",
                            "toolbar_bg": "#f1f3f6",
                            "enable_publishing": false,
                            "allow_symbol_change": true,
                            "container_id": "tradingview_detail"
                        }
                    );
                    /*]]>*/
                </script>
            </div>
            </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>

</body>
</html>
