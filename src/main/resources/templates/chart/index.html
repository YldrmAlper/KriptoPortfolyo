<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head th:replace="~{fragments/header :: head('Grafikler — KriptoPortföy')}"></head>
<body>

<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="page-content">
    <div class="container-fluid px-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="section-title mb-1">Piyasa Grafikleri</h3>
                <p class="section-subtitle mb-0">Canlı TradingView verileri ile piyasayı takip edin.</p>
            </div>
        </div>

        <div class="dashboard-card p-0 overflow-hidden" style="height: 75vh; min-height: 500px;">
            <!-- TradingView Widget BEGIN -->
            <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
                <div id="tradingview_main" style="height: 100%; width: 100%;"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                <script type="text/javascript">
                    new TradingView.widget(
                        {
                            "autosize": true,
                            "symbol": "BINANCE:BTCUSDT",
                            "interval": "D",
                            "timezone": "Etc/UTC",
                            "theme": "dark",
                            "style": "1",
                            "locale": "tr",
                            "toolbar_bg": "#f1f3f6",
                            "enable_publishing": false,
                            "allow_symbol_change": true,
                            "container_id": "tradingview_main"
                        }
                    );
                </script>
            </div>
            <!-- TradingView Widget END -->
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>

</body>
</html>
