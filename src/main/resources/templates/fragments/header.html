<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ============================================== -->
<!-- HEADER FRAGMENT: Navbar + CSS/Meta Imports      -->
<!-- ============================================== -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">KriptoPortfolyo</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Özel Stil Dosyası -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
<!-- ============================================== -->
<!-- NAVBAR FRAGMENT                                 -->
<!-- ============================================== -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark sticky-top"
     style="background: linear-gradient(135deg, #0f0c29 0%, #1a1a2e 50%, #16213e 100%);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);">
    <div class="container">
        <!-- Logo ve Marka -->
        <a class="navbar-brand d-flex align-items-center" th:href="@{/dashboard}">
            <i class="bi bi-currency-bitcoin fs-3 me-2"
               style="color: #f7931a; filter: drop-shadow(0 0 8px rgba(247,147,26,0.5));"></i>
            <span class="fw-bold" style="letter-spacing: -0.5px;">
                Kripto<span style="color: #00d2ff;">Portföy</span>
            </span>
        </a>

        <!-- Mobil Menü Butonu -->
        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Linkleri -->
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto" sec:authorize="isAuthenticated()">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/portfolio}">
                        <i class="bi bi-wallet2 me-1"></i> Portföy
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/exchanges}">
                        <i class="bi bi-bank me-1"></i> Borsalar
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/coins}">
                        <i class="bi bi-coin me-1"></i> Coinler
                    </a>
                </li>
            </ul>

            <!-- Kullanıcı Bilgisi ve Çıkış -->
            <div class="d-flex align-items-center" sec:authorize="isAuthenticated()">
                <span class="text-light me-3 d-flex align-items-center">
                    <i class="bi bi-person-circle me-1" style="color: #00d2ff;"></i>
                    <span sec:authentication="name" class="fw-medium">Kullanıcı</span>
                </span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i> Çıkış
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
