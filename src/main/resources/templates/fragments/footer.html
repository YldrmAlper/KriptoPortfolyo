<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- ============================================== -->
<!-- FOOTER FRAGMENT                                 -->
<!-- ============================================== -->
<footer th:fragment="footer" class="py-4 mt-auto"
        style="background: linear-gradient(135deg, #0f0c29 0%, #1a1a2e 100%);
               border-top: 1px solid rgba(255,255,255,0.08);">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6 text-center text-md-start">
                <p class="mb-0 text-secondary small">
                    <i class="bi bi-currency-bitcoin" style="color: #f7931a;"></i>
                    KriptoPortföy &copy; 2026 — Tüm hakları saklıdır.
                </p>
            </div>
            <div class="col-md-6 text-center text-md-end">
                <p class="mb-0 text-secondary small">
                    Spring Boot & Thymeleaf ile geliştirildi
                    <i class="bi bi-heart-fill" style="color: #e74c3c;"></i>
                </p>
            </div>
        </div>
    </div>
</footer>

<!-- ============================================== -->
<!-- SCRIPTS FRAGMENT: Bootstrap JS + jQuery          -->
<!-- ============================================== -->
<div th:fragment="scripts">
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
