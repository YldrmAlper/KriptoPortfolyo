<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head th:replace="~{fragments/header :: head('Borsalarım — KriptoPortföy')}"></head>
<body>

<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="page-content">
    <div class="container">

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-4">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-4">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="section-title mb-1">Borsa Yönetimi</h3>
                <p class="section-subtitle mb-0">Portföyünüze eklediğiniz kripto borsalarınızı yönetin.</p>
            </div>
            <div>
                <button type="button" class="btn btn-warning-gradient" data-bs-toggle="modal" data-bs-target="#addExchangeModal">
                    <i class="bi bi-plus-lg me-1"></i> Yeni Borsa Ekle
                </button>
            </div>
        </div>

        <div class="dashboard-card p-0 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-dark table-borderless portfolio-table mb-0 text-white" style="--bs-table-bg: transparent;">
                    <thead style="background: rgba(0,0,0,0.3);">
                    <tr>
                        <th class="ps-4">Logo</th>
                        <th>Borsa Adı</th>
                        <th class="text-end pe-4">İşlemler</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(exchanges)}">
                        <td colspan="3" class="text-center py-5 text-secondary">
                            <i class="bi bi-bank fs-1 mb-2 d-block"></i>
                            <p>Henüz borsa eklenmemiş.</p>
                        </td>
                    </tr>
                    <tr th:each="ex : ${exchanges}">
                        <td class="ps-4">
                            <img th:if="${ex.logoBase64 != null}" th:src="'data:' + ${ex.logoContentType} + ';base64,' + ${ex.logoBase64}" class="coin-logo-sm" alt="logo">
                            <img th:unless="${ex.logoBase64 != null}" th:src="@{/images/exchange/{id}(id=${ex.id})}" class="coin-logo-sm" alt="logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2830/2830284.png'">
                        </td>
                        <td class="fw-bold align-middle" th:text="${ex.name}">Binance</td>
                        <td class="text-end pe-4 align-middle">
                            <button type="button" class="btn btn-sm btn-outline-info border-0 me-2" title="Güncelle"
                                    th:data-id="${ex.id}" th:data-name="${ex.name}"
                                    onclick="openUpdateExchangeModal(this)">
                                <i class="bi bi-pencil"></i> Güncelle
                            </button>
                            <form th:action="@{/exchanges/delete/{id}(id=${ex.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger border-0" title="Sil" onclick="return confirm('Bu borsayı silmek istediğinize emin misiniz? (Portföyde kullanılıyorsa silinmeyecektir)');">
                                    <i class="bi bi-trash"></i> Sil
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>

<div th:replace="~{fragments/modals :: addExchangeModal}"></div>

<div class="modal fade" id="updateExchangeModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-content-dark">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-pencil-square me-2 text-warning"></i>Borsayı Güncelle</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="updateExchangeForm" method="post" enctype="multipart/form-data" th:action="@{/}">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Borsa Adı</label>
                        <input type="text" name="name" id="updateExchangeName" class="form-control form-control-dark" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Yeni Logo (Opsiyonel)</label>
                        <input type="file" name="logoFile" class="form-control form-control-dark" accept="image/*">
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="submit" class="btn btn-warning-gradient">Güncelle</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function openUpdateExchangeModal(btn) {
        document.getElementById('updateExchangeName').value = btn.dataset.name;
        document.getElementById('updateExchangeForm').action = '/exchanges/update/' + btn.dataset.id;
        new bootstrap.Modal(document.getElementById('updateExchangeModal')).show();
    }
</script>

</body>
</html>
