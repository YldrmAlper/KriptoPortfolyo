<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">

<head th:replace="~{fragments/header :: head('Kayıt Ol — KriptoPortföy')}">
</head>

<body class="auth-body d-flex align-items-center justify-content-center min-vh-100">

<!-- Animasyonlu Arka Plan Parçacıkları -->
<div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <!-- Logo -->
            <div class="text-center mb-4">
                <i class="bi bi-currency-bitcoin display-1"
                   style="color: #f7931a; filter: drop-shadow(0 0 20px rgba(247,147,26,0.4));"></i>
                <h2 class="text-white fw-bold mt-2">
                    Kripto<span style="color: #00d2ff;">Portföy</span>
                </h2>
                <p class="text-secondary">Yeni hesap oluşturun</p>
            </div>

            <!-- Kayıt Kartı -->
            <div class="card auth-card border-0 shadow-lg">
                <div class="card-body p-4">

                    <!-- Genel Hata Mesajı (Service'den gelen) -->
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show"
                         role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                        <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <h5 class="card-title text-center text-white mb-4">
                        <i class="bi bi-person-plus me-1"></i> Kayıt Ol
                    </h5>

                    <!-- Kayıt Formu -->
                    <form th:action="@{/register}" method="post" th:object="${userRegisterDto}">

                        <!-- Kullanıcı Adı -->
                        <div class="mb-3">
                            <label for="reg-username" class="form-label text-light">
                                <i class="bi bi-person me-1"></i> Kullanıcı Adı
                            </label>
                            <input type="text" id="reg-username" th:field="*{username}"
                                   class="form-control form-control-dark"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                                   placeholder="Kullanıcı adınızı girin">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                                 th:errors="*{username}">
                            </div>
                        </div>

                        <!-- E-posta -->
                        <div class="mb-3">
                            <label for="reg-email" class="form-label text-light">
                                <i class="bi bi-envelope me-1"></i> E-posta
                            </label>
                            <input type="email" id="reg-email" th:field="*{email}"
                                   class="form-control form-control-dark"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   placeholder="ornek@mail.com">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}">
                            </div>
                        </div>

                        <!-- Şifre -->
                        <div class="mb-3">
                            <label for="reg-password" class="form-label text-light">
                                <i class="bi bi-lock me-1"></i> Şifre
                            </label>
                            <input type="password" id="reg-password" th:field="*{password}"
                                   class="form-control form-control-dark"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                   placeholder="En az 6 karakter">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}">
                            </div>
                        </div>

                        <!-- Şifre Tekrarı -->
                        <div class="mb-4">
                            <label for="reg-confirmPassword" class="form-label text-light">
                                <i class="bi bi-lock-fill me-1"></i> Şifre Tekrarı
                            </label>
                            <input type="password" id="reg-confirmPassword" th:field="*{confirmPassword}"
                                   class="form-control form-control-dark"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                                   placeholder="Şifrenizi tekrar girin">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                                 th:errors="*{confirmPassword}">
                            </div>
                        </div>

                        <!-- Kayıt Butonu -->
                        <button type="submit" class="btn btn-success-gradient w-100 py-2 fw-semibold">
                            <i class="bi bi-person-check me-1"></i> Kayıt Ol
                        </button>
                    </form>

                    <!-- Giriş Linki -->
                    <div class="text-center mt-3">
                        <span class="text-secondary">Zaten hesabınız var mı?</span>
                        <a th:href="@{/login}" class="text-info text-decoration-none fw-medium">
                            Giriş Yap
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
