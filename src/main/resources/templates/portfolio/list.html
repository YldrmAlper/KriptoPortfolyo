<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">

<head th:replace="~{fragments/header :: head('Portföyüm — KriptoPortföy')}">
</head>

<body>

<!-- Navbar -->
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="page-content">
    <div class="container">

        <!-- Başarı / Hata Mesajları -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-4">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-4">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="section-title mb-1">Varlık Listesi</h3>
                <p class="section-subtitle mb-0">Manuel olarak eklediğiniz tüm kripto varlıklarınızı yönetin.</p>
            </div>
            <div>
                <button type="button" class="btn btn-primary-gradient" data-bs-toggle="modal" data-bs-target="#addPortfolioModal">
                    <i class="bi bi-plus-lg me-1"></i> Varlık Ekle
                </button>
            </div>
        </div>

        <!-- Portföy Kartı -->
        <div class="dashboard-card p-0 overflow-hidden">
            <div class="p-3 border-bottom border-secondary" style="background: rgba(255,255,255,0.02);">
                <div class="row">
                    <div class="col-md-4">
                        <div class="search-wrapper">
                            <i class="bi bi-search search-icon"></i>
                            <input type="text" id="searchInput" class="search-input" placeholder="Coin veya borsa ara...">
                        </div>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-dark table-borderless portfolio-table mb-0 text-white" style="--bs-table-bg: transparent;">
                    <thead style="background: rgba(0,0,0,0.3);">
                    <tr>
                        <th class="ps-4">Varlık</th>
                        <th>Borsa</th>
                        <th class="text-end">Miktar</th>
                        <th class="text-end">Maliyet / Adet</th>
                        <th class="text-end">Toplam Maliyet</th>
                        <th class="text-center pe-4">İşlemler</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Portföy Boşsa -->
                    <tr th:if="${#lists.isEmpty(portfolioItems)}">
                        <td colspan="6" class="text-center py-5 text-secondary">
                            <i class="bi bi-inbox fs-1 mb-2 d-block"></i>
                            <p>Henüz portföyünüze hiç varlık eklenmemiş.</p>
                        </td>
                    </tr>

                    <!-- Portföy Doluysa -->
                    <tr th:each="item : ${portfolioItems}">
                        <!-- Coin Bilgisi -->
                        <td class="ps-4">
                            <div class="d-flex align-items-center">
                                <img th:if="${item.coinLogoBase64 != null}"
                                     th:src="'data:' + ${item.coinLogoContentType} + ';base64,' + ${item.coinLogoBase64}"
                                     class="coin-logo me-3" alt="logo">
                                <img th:unless="${item.coinLogoBase64 != null}"
                                     th:src="@{/images/coin/{id}(id=${item.coinId})}"
                                     class="coin-logo me-3" alt="logo"
                                     onerror="this.src='https://cdn-icons-png.flaticon.com/512/1490/1490919.png'">
                                <div>
                                    <div class="fw-bold" th:text="${item.coinName}">Bitcoin</div>
                                    <div class="text-secondary small" th:text="${item.coinSymbol}">BTC</div>
                                </div>
                            </div>
                        </td>
                        
                        <!-- Borsa Bilgisi -->
                        <td>
                            <div class="d-flex align-items-center">
                                <img th:if="${item.exchangeLogoBase64 != null}"
                                     th:src="'data:' + ${item.exchangeLogoContentType} + ';base64,' + ${item.exchangeLogoBase64}"
                                     class="coin-logo-sm me-2" alt="ex">
                                <img th:unless="${item.exchangeLogoBase64 != null}"
                                     th:src="@{/images/exchange/{id}(id=${item.exchangeId})}"
                                     class="coin-logo-sm me-2" alt="ex"
                                     onerror="this.src='https://cdn-icons-png.flaticon.com/512/2830/2830284.png'">
                                <span class="text-light" th:text="${item.exchangeName}">Binance</span>
                            </div>
                        </td>
                        
                        <!-- Miktar -->
                        <td class="text-end fw-medium" th:text="${#numbers.formatDecimal(item.quantity, 1, 'COMMA', 4, 'POINT')}">0.5</td>
                        
                        <!-- Maliyet -->
                        <td class="text-end" th:text="'$' + ${#numbers.formatDecimal(item.costPerUnit, 1, 'COMMA', 2, 'POINT')}">$50,000</td>
                        
                        <!-- Toplam Maliyet -->
                        <td class="text-end fw-bold text-info" th:text="'$' + ${#numbers.formatDecimal(item.totalCost, 1, 'COMMA', 2, 'POINT')}">$25,000</td>
                        
                        <!-- İşlemler -->
                        <td class="text-center pe-4">
                            <button type="button" class="btn btn-sm btn-outline-info border-0 me-1" title="Güncelle"
                                    th:data-id="${item.id}"
                                    th:data-quantity="${item.quantity}"
                                    th:data-cost="${item.costPerUnit}"
                                    onclick="openUpdatePortfolioModal(this)">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-warning border-0 me-1" title="Sat"
                                    th:data-id="${item.id}"
                                    th:data-coinname="${item.coinName}"
                                    th:data-symbol="${item.coinSymbol}"
                                    th:data-quantity="${item.quantity}"
                                    onclick="openSellModal(this)">
                                <i class="bi bi-cash-coin"></i>
                            </button>
                            <form th:action="@{/portfolio/delete/{id}(id=${item.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger border-0" title="Sil" onclick="return confirm('Bu varlığı silmek istediğinize emin misiniz?');">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>

<!-- Modalları Sayfaya Dahil Et -->
<div th:replace="~{fragments/modals :: addPortfolioModal}"></div>
<div th:replace="~{fragments/modals :: addExchangeModal}"></div>
<div th:replace="~{fragments/modals :: addCoinModal}"></div>

<!-- Portföy Güncelleme Modal -->
<div class="modal fade" id="updatePortfolioModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-content-dark">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-pencil-square me-2 text-accent"></i>Varlık Güncelle</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="updatePortfolioForm" method="post" th:action="@{/}">
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Adet</label>
                            <input type="number" step="0.00000001" name="quantity" id="updateQuantity" class="form-control form-control-dark" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Birim Maliyet ($)</label>
                            <input type="number" step="0.00000001" name="costPerUnit" id="updateCostPerUnit" class="form-control form-control-dark" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="submit" class="btn btn-primary-gradient">Güncelle</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Coin Satış Modal -->
<div class="modal fade" id="sellModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-content-dark">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-cash-coin me-2 text-warning"></i>Varlık Sat</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="sellForm" method="post" th:action="@{/}">
                <div class="modal-body">
                    <div class="mb-3">
                        <span class="text-secondary">Coin:</span>
                        <span id="sellCoinName" class="fw-bold text-light ms-2">—</span>
                        <span id="sellCoinSymbol" class="text-secondary ms-1">(—)</span>
                    </div>
                    <div class="mb-3">
                        <span class="text-secondary">Mevcut Miktar:</span>
                        <span id="sellMaxQty" class="fw-bold text-info ms-2">—</span>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Satış Adedi</label>
                            <input type="number" step="0.00000001" name="sellQuantity" id="sellQuantity" class="form-control form-control-dark" required min="0.00000001">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Satış Fiyatı ($/Adet)</label>
                            <input type="number" step="0.00000001" name="sellPrice" id="sellPrice" class="form-control form-control-dark" required min="0">
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="submit" class="btn btn-warning-gradient">Sat</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Arama, Güncelleme ve Satış Scriptleri -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const searchInput = document.getElementById("searchInput");
        const tableRows = document.querySelectorAll(".portfolio-table tbody tr");

        if (searchInput) {
            searchInput.addEventListener("keyup", function (e) {
                const term = e.target.value.toLowerCase();
                tableRows.forEach(row => {
                    const coinName = row.querySelector("td:nth-child(1) .fw-bold")?.textContent.toLowerCase() || "";
                    const coinSymbol = row.querySelector("td:nth-child(1) .text-secondary")?.textContent.toLowerCase() || "";
                    const exchangeName = row.querySelector("td:nth-child(2) span")?.textContent.toLowerCase() || "";
                    
                    if (coinName.includes(term) || coinSymbol.includes(term) || exchangeName.includes(term)) {
                        row.style.display = "";
                    } else {
                        row.style.display = "none";
                    }
                });
            });
        }
    });

    function openUpdatePortfolioModal(btn) {
        document.getElementById('updateQuantity').value = btn.dataset.quantity;
        document.getElementById('updateCostPerUnit').value = btn.dataset.cost;
        document.getElementById('updatePortfolioForm').action = '/portfolio/update/' + btn.dataset.id;
        new bootstrap.Modal(document.getElementById('updatePortfolioModal')).show();
    }

    function openSellModal(btn) {
        document.getElementById('sellCoinName').textContent = btn.dataset.coinname;
        document.getElementById('sellCoinSymbol').textContent = '(' + btn.dataset.symbol + ')';
        document.getElementById('sellMaxQty').textContent = btn.dataset.quantity;
        document.getElementById('sellQuantity').max = btn.dataset.quantity;
        document.getElementById('sellQuantity').value = '';
        document.getElementById('sellPrice').value = '';
        document.getElementById('sellForm').action = '/portfolio/sell/' + btn.dataset.id;
        new bootstrap.Modal(document.getElementById('sellModal')).show();
    }
</script>

</body>
</html>
