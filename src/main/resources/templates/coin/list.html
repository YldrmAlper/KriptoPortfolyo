<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head th:replace="~{fragments/header :: head('Coinlerim — KriptoPortföy')}"></head>
<body>

<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="page-content">
    <div class="container">

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-4">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-4">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="section-title mb-1">Coin Yönetimi</h3>
                <p class="section-subtitle mb-0">Sisteme kaydettiğiniz kripto paraları yönetin.</p>
            </div>
            <div>
                <button type="button" class="btn btn-info-gradient text-white" data-bs-toggle="modal" data-bs-target="#addCoinModal">
                    <i class="bi bi-plus-lg me-1"></i> Yeni Coin Ekle
                </button>
            </div>
        </div>

        <div class="dashboard-card p-0 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-dark table-borderless portfolio-table mb-0 text-white" style="--bs-table-bg: transparent;">
                    <thead style="background: rgba(0,0,0,0.3);">
                    <tr>
                        <th class="ps-4">Coin</th>
                        <th>Sembol</th>
                        <th class="text-end pe-4">İşlemler</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(coins)}">
                        <td colspan="3" class="text-center py-5 text-secondary">
                            <i class="bi bi-coin fs-1 mb-2 d-block"></i>
                            <p>Henüz coin eklenmemiş.</p>
                        </td>
                    </tr>
                    <tr th:each="c : ${coins}">
                        <td class="ps-4">
                            <div class="d-flex align-items-center">
                                <img th:if="${c.logoBase64 != null}" th:src="'data:' + ${c.logoContentType} + ';base64,' + ${c.logoBase64}" class="coin-logo me-3" alt="logo">
                                <img th:unless="${c.logoBase64 != null}" th:src="@{/images/coin/{id}(id=${c.id})}" class="coin-logo me-3" alt="logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1490/1490919.png'">
                                <div class="fw-bold" th:text="${c.name}">Bitcoin</div>
                            </div>
                        </td>
                        <td class="align-middle" th:text="${c.symbol}">BTC</td>
                        <td class="text-end pe-4 align-middle">
                            <button type="button" class="btn btn-sm btn-outline-info border-0 me-2" title="Güncelle"
                                    th:data-id="${c.id}" th:data-name="${c.name}" th:data-symbol="${c.symbol}"
                                    onclick="openUpdateCoinModal(this)">
                                <i class="bi bi-pencil"></i> Güncelle
                            </button>
                            <form th:action="@{/coins/delete/{id}(id=${c.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger border-0" title="Sil" onclick="return confirm('Bu coini silmek istediğinize emin misiniz? (Portföyde kullanılıyorsa silinmeyecektir)');">
                                    <i class="bi bi-trash"></i> Sil
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>

<div th:replace="~{fragments/modals :: addCoinModal}"></div>

<div class="modal fade" id="updateCoinModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-content-dark">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-pencil-square me-2 text-info"></i>Coin Güncelle</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="updateCoinForm" method="post" enctype="multipart/form-data" th:action="@{/}">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Coin Adı</label>
                        <input type="text" name="name" id="updateCoinName" class="form-control form-control-dark" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Sembol</label>
                        <input type="text" name="symbol" id="updateCoinSymbol" class="form-control form-control-dark" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Yeni Logo (Opsiyonel)</label>
                        <input type="file" name="logoFile" class="form-control form-control-dark" accept="image/*">
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="submit" class="btn btn-info-gradient text-white">Güncelle</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function openUpdateCoinModal(btn) {
        document.getElementById('updateCoinName').value = btn.dataset.name;
        document.getElementById('updateCoinSymbol').value = btn.dataset.symbol;
        document.getElementById('updateCoinForm').action = '/coins/update/' + btn.dataset.id;
        new bootstrap.Modal(document.getElementById('updateCoinModal')).show();
    }
</script>

</body>
</html>
